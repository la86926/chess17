/* Fija la apariencia antes del primer pintado. Lee localStorage y, si no hay, cookie. */
(function(){
  function g(k){
    try{var v=localStorage.getItem(k); if(v)return v;}catch(e){}
    try{var m=document.cookie.match('(?:^|; )'+k+'=([^;]*)'); if(m)return decodeURIComponent(m[1]);}catch(e){}
    return null;
  }
  try{
    var m=g('pc_modo')||'sistema';
    var osc = m==='oscuro' || (m==='sistema' && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-modo', osc?'oscuro':'claro');
  }catch(e){document.documentElement.setAttribute('data-modo','oscuro');}
})();
</script>

<!-- Aprende Ajedrez se carga la primera vez que se abre (así PC1 y PC2 no tardan más en abrir). -->
<iframe class="app-frame" id="app-frame-3" data-src="index3.html?v=c17-1" title="Aprende Ajedrez" allow="autoplay"></iframe>
<script>
(function(){
  var menuButton=document.getElementById('menu-button');
  var backdrop=document.getElementById('drawer-backdrop');
  var activeApp='1';

  function impedirZoom(e){e.preventDefault();}
  document.addEventListener('gesturestart',impedirZoom,{passive:false});
  document.addEventListener('gesturechange',impedirZoom,{passive:false});
  document.addEventListener('gestureend',impedirZoom,{passive:false});
  document.addEventListener('touchmove',function(e){if(e.touches&&e.touches.length>1)e.preventDefault();},{passive:false});

  function setDrawer(open){
    backdrop.classList.toggle('open',open);
    menuButton.classList.toggle('open',open);
    menuButton.setAttribute('aria-expanded',open?'true':'false');
    backdrop.setAttribute('aria-hidden',open?'false':'true');
    if(open) aplicarModo();
  }
  function selectApp(id){
    activeApp=String(id);
    var frames=document.querySelectorAll('.app-frame');
    for(var i=0;i<frames.length;i++){
      /* al cambiar de sección, la mascota de la sección que se deja se va */
      if(frames[i].id!=='app-frame-'+activeApp){try{var w=frames[i].contentWindow;if(w&&w.pcMascota)w.pcMascota.quitar();}catch(e){}}
      frames[i].classList.remove('active');
    }
    var frame=document.getElementById('app-frame-'+activeApp);
    if(frame&&!frame.getAttribute('src')&&frame.dataset.src) frame.setAttribute('src',frame.dataset.src);
    if(frame) frame.classList.add('active');
    var choices=document.querySelectorAll('.app-choice');
    for(var j=0;j<choices.length;j++) choices[j].classList.toggle('active',choices[j].getAttribute('data-app')===activeApp);
    /* «Mi ID» no es una sección de avance: no se recuerda como la última abierta */
    if(activeApp!=='id'){
      try{localStorage.setItem('pc_l3_active_app',activeApp);}catch(e){}
      try{document.cookie='pc_l3_active_app='+activeApp+';path=/;max-age=63072000;SameSite=Lax';}catch(e){}
    }
    setDrawer(false);
  }
  menuButton.onclick=function(){setDrawer(!backdrop.classList.contains('open'));};
  backdrop.onclick=function(e){if(e.target===backdrop)setDrawer(false);};
  var choices=document.querySelectorAll('.app-choice');
  for(var i=0;i<choices.length;i++) choices[i].onclick=function(){selectApp(this.getAttribute('data-app'));};
  var guardado=null;
  try{guardado=localStorage.getItem('pc_l3_active_app');}catch(e){}
  if(!guardado) guardado=galleta('pc_l3_active_app');
  /* Sección al abrir:
     - Si hay una sección guardada (también la que llega de la nube con el código), se abre esa.
     - Si no hay ninguna guardada pero la persona ya tiene avance o un código de progreso,
       se mantiene lo de siempre: Método PC1.
     - Solo quien es nuevo de verdad entra a Aprende Ajedrez, la primera sección. */
  function hayAvanceOCodigo(){
    try{
      if(localStorage.getItem('pc_cloud_sync_code_v1'))return true;
      var ks=['wp_solved','wp2_solved','wp_hist_log','wp2_hist_log'];
      for(var i=0;i<ks.length;i++){var v=localStorage.getItem(ks[i]);if(v&&v!=='[]'&&v!=='{}'&&v!=='null')return true;}
    }catch(e){}
    return false;
  }
  if(guardado==='2'||guardado==='3') selectApp(guardado);
  else if(guardado!=='1'&&!hayAvanceOCodigo()) selectApp('3');

  /* ---- apariencia: misma clave que los métodos, así los tres van a una ---- */
  var raiz=document.documentElement, K='pc_modo';
  var mq=window.matchMedia('(prefers-color-scheme: dark)');
  function galleta(k){try{var m=document.cookie.match('(?:^|; )'+k+'=([^;]*)');return m?decodeURIComponent(m[1]):null}catch(e){return null}}
  function leerModo(){
    var v=null;
    try{ v=localStorage.getItem(K); }catch(e){}
    if(!v) v=galleta(K);
    return v||'sistema';
  }
  function guardarModo(v){
    try{ localStorage.setItem(K,v); }catch(e){}
    try{ document.cookie=K+'='+encodeURIComponent(v)+';path=/;max-age=63072000;SameSite=Lax'; }catch(e){}
  }
  var modo=leerModo();
  function aplicarModo(){
    modo=leerModo();
    if(['claro','oscuro','sistema'].indexOf(modo)<0) modo='sistema';
    var oscuro = modo==='oscuro' || (modo==='sistema' && mq.matches);
    raiz.setAttribute('data-modo', oscuro?'oscuro':'claro');
    var bs=document.querySelectorAll('#tema button');
    for(var i=0;i<bs.length;i++) bs[i].setAttribute('aria-pressed', String(bs[i].getAttribute('data-modo')===modo));
    var m=document.querySelector('meta[name="theme-color"]');
    if(m) m.setAttribute('content', oscuro?'#17142A':'#F3F1FA');
  }
  var bt=document.querySelectorAll('#tema button');
  for(var t=0;t<bt.length;t++){
    bt[t].onclick=function(){
      guardarModo(this.getAttribute('data-modo'));
      aplicarModo();
      /* avisa a los métodos ya cargados */
      var frames=document.querySelectorAll('.app-frame');
      for(var i=0;i<frames.length;i++){
        try{ if(frames[i].contentWindow) frames[i].contentWindow.dispatchEvent(new StorageEvent('storage',{key:K})); }catch(e){}
      }
    };
  }
  if(mq.addEventListener) mq.addEventListener('change',function(){ if(modo==='sistema') aplicarModo(); });
  else if(mq.addListener) mq.addListener(function(){ if(modo==='sistema') aplicarModo(); });
  window.addEventListener('storage',function(e){ if(!e||!e.key||e.key===K) aplicarModo(); });
  aplicarModo();

  /* Reenvía al método activo las respuestas del selector, portapapeles y guardado nativo. */
  window.pcAndroidResultadoBase64=function(tipoBase64,datoBase64){
    var frame=document.getElementById('app-frame-'+activeApp);
    try{
      if(frame && frame.contentWindow && typeof frame.contentWindow.pcAndroidResultadoBase64==='function'){
        frame.contentWindow.pcAndroidResultadoBase64(tipoBase64,datoBase64);
      }
    }catch(e){}
  };

  window.PC_ANDROID_BACK=function(){
    if(backdrop.classList.contains('open')){setDrawer(false);return true;}
    var frame=document.getElementById('app-frame-'+activeApp);
    try{
      if(frame && frame.contentWindow && typeof frame.contentWindow.PC_ANDROID_BACK==='function'){
        frame.contentWindow.PC_ANDROID_BACK();
        return true;
      }
    }catch(e){}
    return true;
  };

  function bloquearZoomFrame(frame){
    try{
      var doc=frame&&frame.contentDocument;
      if(!doc||!doc.documentElement||doc.documentElement.dataset.zoomBloqueado)return;
      var meta=doc.querySelector('meta[name="viewport"]');
      if(meta) meta.setAttribute('content','width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no');
      doc.addEventListener('gesturestart',impedirZoom,{passive:false});
      doc.addEventListener('gesturechange',impedirZoom,{passive:false});
      doc.addEventListener('gestureend',impedirZoom,{passive:false});
      doc.addEventListener('touchmove',function(e){if(e.touches&&e.touches.length>1)e.preventDefault();},{passive:false});
      doc.documentElement.dataset.zoomBloqueado='1';
    }catch(e){}
  }

  function bloquearScrollHorizontalFrame(frame){
    try{
      var doc=frame&&frame.contentDocument;
      var win=frame&&frame.contentWindow;
      if(!doc||!doc.documentElement||doc.documentElement.dataset.scrollHorizontalBloqueado)return;
      doc.documentElement.style.overflowX='hidden';
      doc.documentElement.style.maxWidth='100%';
      doc.documentElement.style.overscrollBehaviorX='none';
      doc.documentElement.style.touchAction='pan-y';
      if(doc.body){
        doc.body.style.overflowX='hidden';
        doc.body.style.maxWidth='100%';
        doc.body.style.overscrollBehaviorX='none';
        doc.body.style.touchAction='pan-y';
      }
      if(win) win.addEventListener('scroll',function(){if(win.scrollX!==0)win.scrollTo(0,win.scrollY);},{passive:true});
      doc.documentElement.dataset.scrollHorizontalBloqueado='1';
    }catch(e){}
  }

  function mostrarControlesAnalisisSiempre(frame){
    try{
      var doc=frame&&frame.contentDocument;
      var win=frame&&frame.contentWindow;
      if(!doc||!doc.head||!win)return;
      var anterior=doc.getElementById('b-ana-prev');
      var siguiente=doc.getElementById('b-ana-next');
      var droidfish=doc.getElementById('b-edit');
      var tablero=doc.getElementById('board');
      if(!anterior||!siguiente||!droidfish)return;
      if(!doc.getElementById('controles-analisis-siempre-visibles')){
        var estilo=doc.createElement('style');
        estilo.id='controles-analisis-siempre-visibles';
        estilo.textContent='#b-ana-prev,#b-ana-next{display:flex!important;visibility:visible!important;transition:opacity .22s ease,filter .22s ease!important;}#b-ana-prev[data-historial-apagado="1"],#b-ana-next[data-historial-apagado="1"]{opacity:.34!important;filter:saturate(.35);cursor:default;}#b-ana-prev[data-historial-apagado="0"],#b-ana-next[data-historial-apagado="0"]{opacity:1!important;filter:none;}';
        doc.head.appendChild(estilo);
      }
      if(typeof win.__pcEstadoHistorialFlechas!=='function'){
        var puente=doc.createElement('script');
        puente.textContent='window.__pcEstadoHistorialFlechas=function(){try{return{ejercicio:String(state.filter)+"|"+String(state.i)+"|"+String(state.fen),historial:Array.isArray(state.anaMoves),ptr:Number(state.anaPtr)||0,total:Array.isArray(state.anaMoves)?state.anaMoves.length:0};}catch(e){return null;}};';
        doc.documentElement.appendChild(puente);
        puente.remove();
      }
      function estadoHistorial(){
        try{return typeof win.__pcEstadoHistorialFlechas==='function'?win.__pcEstadoHistorialFlechas():null;}catch(e){return null;}
      }
      function prepararEjercicio(estado){
        var raiz=doc.documentElement;
        if(raiz.dataset.historialEjercicio!==estado.ejercicio){
          raiz.dataset.historialEjercicio=estado.ejercicio;
          raiz.dataset.droidfishIniciado='0';
        }
        return raiz;
      }
      function pintar(boton,activo){
        boton.setAttribute('data-historial-apagado',activo?'0':'1');
        boton.setAttribute('aria-disabled',activo?'false':'true');
      }
      function sincronizarFlechas(){
        var estado=estadoHistorial();
        if(!estado)return;
        var raiz=prepararEjercicio(estado);
        var disponible=estado.historial;
        pintar(anterior,disponible&&estado.ptr>0);
        pintar(siguiente,disponible&&estado.ptr<estado.total);
      }
      function programarSincronizacion(){win.requestAnimationFrame(sincronizarFlechas);}
      function bloquearSiApagado(e){
        if(this.getAttribute('data-historial-apagado')==='1'){
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      }
      if(!anterior.dataset.controlHistorialFlechas){
        anterior.addEventListener('click',bloquearSiApagado,true);
        siguiente.addEventListener('click',bloquearSiApagado,true);
        anterior.addEventListener('click',programarSincronizacion);
        siguiente.addEventListener('click',programarSincronizacion);
        anterior.dataset.controlHistorialFlechas='1';
        siguiente.dataset.controlHistorialFlechas='1';
      }
      if(!droidfish.dataset.activacionVisualFlechas){
        droidfish.addEventListener('click',function(){
          win.requestAnimationFrame(function(){
            var estado=estadoHistorial();
            if(!estado)return;
            var raiz=prepararEjercicio(estado);
            if(estado.historial)raiz.dataset.droidfishIniciado='1';
            sincronizarFlechas();
          });
        });
        droidfish.dataset.activacionVisualFlechas='1';
      }
      if(tablero&&!tablero.dataset.observaHistorialFlechas){
        new win.MutationObserver(programarSincronizacion).observe(tablero,{childList:true,subtree:true});
        tablero.dataset.observaHistorialFlechas='1';
      }
      sincronizarFlechas();
    }catch(e){}
  }

  function fijarTamanoBotonDroidfish(frame){
    requestAnimationFrame(function(){
      try{
        var doc=frame&&frame.contentDocument;
        var boton=doc&&doc.getElementById('b-edit');
        if(!boton||boton.dataset.tamanoDroidfishFijo)return;
        var fila=boton.parentElement;
        var ids=['b-reset','b-edit','b-anotar','b-ana-prev','b-ana-next'];
        if(fila){
          fila.style.gap='.3rem';
          fila.style.alignItems='center';
          fila.style.justifyContent='center';
        }
        for(var i=0;i<ids.length;i++){
          var b=doc.getElementById(ids[i]);
          if(!b)continue;
          b.style.flex='0 0 calc((100% - 1.2rem)/5)';
          b.style.width='calc((100% - 1.2rem)/5)';
          b.style.minWidth='0';
          b.style.maxWidth='calc((100% - 1.2rem)/5)';
          b.style.height='2.55rem';
          b.style.minHeight='2.55rem';
          b.style.maxHeight='2.55rem';
          b.style.padding='0 .16rem';
          b.style.fontSize='clamp(.66rem,2.85vw,.88rem)';
          b.style.lineHeight='1';
          b.style.gap='.22rem';
          b.style.whiteSpace='nowrap';
          b.style.overflow='hidden';
          b.style.justifyContent='center';
          b.style.alignItems='center';
          b.style.alignSelf='center';
          b.style.boxSizing='border-box';
          if((ids[i]==='b-ana-prev'||ids[i]==='b-ana-next')&&b.querySelector('svg')){
            b.querySelector('svg').style.width='1.55rem';
            b.querySelector('svg').style.height='1.55rem';
          }
        }
        function ajustarContenidoDroidfish(){
          var esDroidfish=!!boton.querySelector('svg');
          boton.style.fontSize=esDroidfish?'clamp(.62rem,2.6vw,.82rem)':'clamp(.66rem,2.85vw,.88rem)';
          boton.style.gap=esDroidfish?'.16rem':'.22rem';
          var icono=boton.querySelector('svg');
          if(icono){
            icono.style.width='.88rem';
            icono.style.height='.88rem';
            icono.style.flex='0 0 .88rem';
          }
        }
        ajustarContenidoDroidfish();
        if(!boton.dataset.ajusteVisualDroidfish){
          new MutationObserver(ajustarContenidoDroidfish).observe(boton,{childList:true});
          boton.dataset.ajusteVisualDroidfish='1';
        }
        boton.dataset.tamanoDroidfishFijo='1';
      }catch(e){}
    });
  }
  var appFrames=document.querySelectorAll('.app-frame');
  for(var f=0;f<appFrames.length;f++) appFrames[f].addEventListener('load',function(){bloquearZoomFrame(this);bloquearScrollHorizontalFrame(this);mostrarControlesAnalisisSiempre(this);fijarTamanoBotonDroidfish(this);});
  var appChoices=document.querySelectorAll('.app-choice');
  for(var c=0;c<appChoices.length;c++) appChoices[c].addEventListener('click',function(){var frame=document.getElementById('app-frame-'+this.getAttribute('data-app'));bloquearZoomFrame(frame);bloquearScrollHorizontalFrame(frame);mostrarControlesAnalisisSiempre(frame);fijarTamanoBotonDroidfish(frame);});
  bloquearZoomFrame(document.getElementById('app-frame-1'));
  bloquearScrollHorizontalFrame(document.getElementById('app-frame-1'));
  mostrarControlesAnalisisSiempre(document.getElementById('app-frame-1'));
  fijarTamanoBotonDroidfish(document.getElementById('app-frame-1'));
})();
</script>

  <div class="tuto-velo"></div>

  <span class="tuto-ficha" id="tuto-ficha" aria-hidden="true"><svg viewBox="0 0 45 45"><path d="M22 10c10.5 1 16.5 8 16 29H15c0-9 10-6.5 8-21" fill="#fff" stroke="#1B1730" stroke-width="1.6" stroke-linejoin="round"/><path d="M24 18c.4 2.9-5.5 7.4-8 9-3 2-2.8 4.3-5 4-1-.9 1.4-3 0-3-1 0 .2 1.2-1 2-1 0-4 1-4-4 0-2 6-12 6-12s1.9-1.9 2-3.5c-.7-1-.5-2-.5-3 1-1 3 2.5 3 2.5h2s.8-2 2.5-3c1 0 1 3 1 3" fill="#fff" stroke="#1B1730" stroke-width="1.6" stroke-linejoin="round"/></svg></span>
  <span class="tuto-mano" id="tuto-mano" aria-hidden="true"><svg viewBox="0 0 64 64"><path d="M25 6.5c2.6 0 4.5 2 4.5 4.6V29l1.2-.4V24c0-2.4 1.9-4.2 4.2-4.2s4.2 1.8 4.2 4.2v4.3l.9-.2v-1.6c0-2.3 1.9-4.1 4.2-4.1s4.1 1.8 4.1 4.1v3.2l.6-.1c2.2-.2 4.1 1.6 4.1 3.8v10.4c0 9.2-7 15.7-16.4 15.7h-2.7c-6.2 0-10.6-2.8-13.9-7.7L12.8 38c-1.3-2-.8-4.6 1.2-5.9 1.9-1.3 4.4-.9 5.8.9l1.1 1.4V11.1c0-2.6 1.6-4.6 4.1-4.6z" fill="#FFEB9E" stroke="#1B1730" stroke-width="2.4" stroke-linejoin="round"/><path d="M30.7 29v8M39.1 28.3v8.4M47.4 30.7v6.9" stroke="#1B1730" stroke-width="2.2" stroke-linecap="round"/></svg></span>
  <section class="tuto-card abajo" id="tuto-card" role="dialog" aria-modal="false" aria-labelledby="tuto-titulo">
    <span class="tuto-paso" id="tuto-paso">Paso 1</span>
    <h3 id="tuto-titulo">Bienvenido</h3>

    <div class="tuto-acciones">
      <button class="tuto-cerrar" id="tuto-cerrar" type="button">Cerrar tutorial</button>
      <button class="tuto-atras" id="tuto-atras" type="button">Atrás</button>
      <button class="tuto-sig" id="tuto-sig" type="button">Siguiente</button>

<script type="module" src="pc-cloud-sync.js?v=9"></script>
<script>
/* ==================================================================
   Tutorial de bienvenida
   - Solo aparece a quien entra por primera vez y no tiene historial.
   - Si la persona escribe su código y se recupera su historial,
     el tutorial no aparece (o se cierra si ya estaba abierto).
   ================================================================== */
(function(){
  var KEY='pc_tutorial_visto_v1';
  var raiz=document.getElementById('tuto');
  var foco=document.getElementById('tuto-foco');
  var mano=document.getElementById('tuto-mano');
  var ficha=document.getElementById('tuto-ficha');
  var card=document.getElementById('tuto-card');
  var elPaso=document.getElementById('tuto-paso');
  var elTitulo=document.getElementById('tuto-titulo');
  var elTexto=document.getElementById('tuto-texto');
  var elPuntos=document.getElementById('tuto-puntos');
  var bAtras=document.getElementById('tuto-atras');
  var bSig=document.getElementById('tuto-sig');
  var bCerrar=document.getElementById('tuto-cerrar');
  var abierto=false,paso=0,reloj=null,vigia=null,estable=0;

  var PASOS_PC=[
    {titulo:'Hola, esto es Chess de L',texto:'Lecciones para empezar y dos métodos para entrenar, en una sola app. En menos de un minuto te enseño qué tocar.',modo:'saludo'},
    {titulo:'Elige tu método',texto:'Este botón abre el menú. Ahí cambias entre Aprende Ajedrez (lecciones por niveles), el Método PC1 (Avanzado: ejercicios tácticos) y el Método PC2 (Muy avanzado: ejercicios posicionales), y ves cuánto llevas de cada uno.',padre:'menu-button',modo:'toque'},
    {titulo:'¿Quién juega?',texto:'Aquí ves el número del ejercicio, su dificultad y qué bando mueve: «Juegan: Blancas» o «Juegan: Negras».',app:'toplay',modo:'toque'},
    {titulo:'Juega sobre el tablero',texto:'Toca una de tus piezas y arrástrala, o toca la casilla de destino. Si es la jugada correcta, el rival responde solo.',app:'board',modo:'arrastre'},
    {titulo:'Más espacio',texto:'«Ocultar» esconde el encabezado de arriba para que el tablero tenga más espacio. «Mostrar» lo vuelve a poner.',app:'b-banner',modo:'toque'},
    {titulo:'Analiza con Stockfish',texto:'El botón del chip enciende Stockfish, el motor de ajedrez: solo entonces aparecen la evaluación de la posición y la mejor línea. A su lado, «Flechas» te deja dibujar flechas sobre el tablero.',app:'b-edit',modo:'toque'},
    {titulo:'Tus botones',texto:'💡 ilumina la pieza que debes mover, «Solución» reproduce la línea completa, «Girar» voltea el tablero, el parlante activa o silencia el sonido, el libro abre la explicación y el último botón comparte la imagen del ejercicio con su enlace, para que quien lo toque llegue directo a ese ejercicio.',app:'pc-fila-controles',modo:'toque'},
    {titulo:'Tu mascota',texto:'Te acompaña sobre el tablero y baila con su guitarra cuando resuelves un ejercicio. Con el botón de su carita, junto al regalo, eliges entre 11 mascotas o la quitas; también con doble toque sobre ella.',app:'pc-mascota',mascota:true,modo:'toque'},
    {titulo:'Tu entrenamiento',texto:'Aquí ves tu meta diaria, tu racha y el cuaderno de errores para repasar los ejercicios que te costaron.',app:'b-gift',modo:'toque'},
    {titulo:'Mi ID',texto:'En el menú, «Mi ID» guarda tu avance en la nube. En otro dispositivo entras con el mismo ID, o escaneas su código QR, y recuperas todo.',padre:'menu-button',modo:'toque'},
    {titulo:'A entrenar',texto:'Resuelve, repite y gana velocidad. Esta guía queda en el menú, en «Ver tutorial».',modo:'saludo',final:true}
  ];
  /* Recorrido de Aprende Ajedrez (la primera sección): se usa cuando es la sección abierta. */
  var PASOS_AA=[
    {titulo:'Bienvenido a Aprende Ajedrez',texto:'Aquí aprendes ajedrez desde cero. Cuando estés listo, el Método PC1 (Avanzado) y el Método PC2 (Muy avanzado) te esperan en el menú.',modo:'saludo'},
    {titulo:'El menú',texto:'Con este botón abres el menú y cambias entre Aprende Ajedrez, el Método PC1 (Avanzado) y el Método PC2 (Muy avanzado).',padre:'menu-button',modo:'toque'},
    {titulo:'Tus pestañas',texto:'«Temario» reúne todas las lecciones, «Mis favoritos» guarda lo que marques con el corazón, «Repaso» te propone posiciones de lo que ya estudiaste para encontrar la jugada, y el botón de la carita, a la derecha, cambia tu mascota. Siempre quedan arriba, aunque bajes por la página.',app:'tabs',modo:'toque'},
    {titulo:'El temario',texto:'Toca un nivel para desplegar sus lecciones y toca una lección para abrirla. Cada lección avanza por pasos numerados: exploras, ves la demostración y resuelves en el tablero.',app:'aa-niveles',modo:'toque'},
    {titulo:'Continuar donde me quedé',texto:'Este botón te lleva directo a la lección y a la etapa donde te quedaste.',app:'aa-continuar-aprendiendo',modo:'toque'},
    {titulo:'Mi ID',texto:'En el menú, «Mi ID» guarda tu avance en la nube. En otro dispositivo entras con el mismo ID, o escaneas su código QR, y recuperas todo.',padre:'menu-button',modo:'toque'},
    {titulo:'A aprender',texto:'Empieza por el Nivel I. Cuando abras tu primera lección te enseño sus botones. Esta guía queda en el menú, en «Ver tutorial».',modo:'saludo',final:true}
  ];
  var PASOS=PASOS_PC;


  function leer(k){try{return localStorage.getItem(k);}catch(e){return null;}}
  function visto(){return leer(KEY)==='1';}
  function marcarVisto(){try{localStorage.setItem(KEY,'1');}catch(e){}}
  function listaLlena(k){
    try{var v=JSON.parse(leer(k)||'null');if(!v)return false;if(Array.isArray(v))return v.length>0;return typeof v==='object'&&Object.keys(v).length>0;}catch(e){return false;}
  }
  function tieneHistorial(){
    return listaLlena('wp_solved')||listaLlena('wp2_solved')||listaLlena('wp_hist_log')||listaLlena('wp2_hist_log')||avanceAprende();
  }
  /* Aprende Ajedrez registra la lección abierta al cargar; eso no es avance.
     Cuenta como avance haber intentado o completado algo. */
  function avanceAprende(){
    try{
      var p=JSON.parse(leer('aa_progreso_v1')||'null'),l=p&&p.lecciones;if(!l)return false;
      for(var k in l){var r=l[k]||{};if(r.estado==='completada'||r.intentos>0||r.aciertos>0||(r.etapasHechas&&r.etapasHechas.length>1))return true;}
    }catch(e){}
    return false;
  }
  function frameActivo(){return document.querySelector('.app-frame.active');}
  function docApp(){try{var f=frameActivo();return f&&f.contentDocument;}catch(e){return null;}}
  function appLista(){var d=docApp();return !!(d&&d.readyState==='complete'&&d.getElementById('board'));}
  function syncAbierto(){var bg=document.getElementById('pc-sync-modal-bg');return !!(bg&&bg.classList.contains('open'));}
  function menuAbierto(){var b=document.getElementById('drawer-backdrop');return !!(b&&b.classList.contains('open'));}

  function objetivo(p){
    var el=null;
    if(p.padre) el=document.getElementById(p.padre);
    else if(p.app){var d=docApp();el=d&&d.getElementById(p.app);}
    if(!el)return null;
    var r=el.getBoundingClientRect();
    if(!r.width||!r.height)return null;
    if(p.app){
      var f=frameActivo(),fr=f?f.getBoundingClientRect():{left:0,top:0};
      if(r.bottom<0||r.top>window.innerHeight){try{el.scrollIntoView({block:'center'});}catch(e){}r=el.getBoundingClientRect();}
      return {left:r.left+fr.left,top:r.top+fr.top,width:r.width,height:r.height};
    }
    return {left:r.left,top:r.top,width:r.width,height:r.height};
  }

  function colocar(){
    if(!abierto)return;
    var p=PASOS[paso],o=(p.padre||p.app)?objetivo(p):null;
    var W=window.innerWidth,H=window.innerHeight;
    mano.className='tuto-mano';ficha.className='tuto-ficha';
    if(o){
      var m=6;
      foco.style.left=(o.left-m)+'px';foco.style.top=(o.top-m)+'px';
      foco.style.width=(o.width+m*2)+'px';foco.style.height=(o.height+m*2)+'px';
      raiz.classList.add('con-foco');
      var cx=o.left+o.width/2,cy=o.top+o.height/2;
      card.className='tuto-card '+(cy>H*0.55?'arriba':'abajo');
      if(p.modo==='arrastre'){
        var x1=o.left+o.width*0.35,y1=o.top+o.height*0.78,x2=o.left+o.width*0.35,y2=o.top+o.height*0.5;
        mano.style.setProperty('--x',x1+'px');mano.style.setProperty('--y',y1+'px');
        mano.style.setProperty('--x2',x2+'px');mano.style.setProperty('--y2',y2+'px');
        ficha.style.setProperty('--x',x1+'px');ficha.style.setProperty('--y',y1+'px');
        ficha.style.setProperty('--x2',x2+'px');ficha.style.setProperty('--y2',y2+'px');
        mano.className='tuto-mano ver arrastre';ficha.className='tuto-ficha ver';
      }else{
        var y=Math.min(cy+o.height*0.15,H-60);
        mano.style.setProperty('--x',cx+'px');mano.style.setProperty('--y',y+'px');
        mano.className='tuto-mano ver toque';
      }
    }else{
      raiz.classList.remove('con-foco');
      card.className='tuto-card centro';
      mano.style.setProperty('--x',(W/2)+'px');
      mano.style.setProperty('--y',Math.max(40,H/2-card.offsetHeight/2-70)+'px');
      mano.className='tuto-mano ver saludo';
    }
  }

  /* En el paso de la mascota, la mostramos de verdad sobre el tablero */
  var mascotaDelTuto=false;
  function mascotaTuto(mostrar){
    try{
      var f=frameActivo(),w=f&&f.contentWindow,m=w&&w.pcMascota;
      if(!m)return;
      if(mostrar&&!mascotaDelTuto){
        var d=docApp(),b=d&&d.getElementById('board');
        if(b)try{b.scrollIntoView({block:'center'});}catch(e){}
        m.mostrar();mascotaDelTuto=true;
      }else if(!mostrar&&mascotaDelTuto){m.quitar();mascotaDelTuto=false;}
    }catch(e){}
  }

  /* Color del tutorial: el de la plantilla (tema de tablero) de la sección abierta.
     Si la persona no eligió ninguna, la plantilla por defecto (Cielo). */
  var CIELO='#7AA4BB';
  function luz(hex){
    var m=/^#?([0-9a-f]{6})$/i.exec(String(hex||'').trim());if(!m)return null;
    var n=parseInt(m[1],16),c=[n>>16&255,n>>8&255,n&255].map(function(v){v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4);});
    return .2126*c[0]+.7152*c[1]+.0722*c[2];
  }
  function aplicarColorTema(){
    var col='';
    try{var f=frameActivo(),d=f&&f.contentDocument;if(d&&d.documentElement)col=getComputedStyle(d.documentElement).getPropertyValue('--dark').trim();}catch(e){}
    if(luz(col)==null)col=CIELO;
    var L=luz(col);
    var fa=frameActivo(),pastel={'app-frame-3':'#B6EDD3','app-frame-1':'#BCD9FF','app-frame-2':'#C9BCFF'}[fa&&fa.id]||'#C9BCFF';
    raiz.style.setProperty('--tuto-acento',pastel);
    raiz.style.setProperty('--tuto-acento-txt','#1B1730');
  }

  function pintar(){
    aplicarColorTema();
    var p=PASOS[paso];
    mascotaTuto(!!p.mascota);
    elPaso.textContent='Paso '+(paso+1)+' de '+PASOS.length;
    elTitulo.textContent=p.titulo;elTexto.textContent=p.texto;
    var h='';for(var i=0;i<PASOS.length;i++)h+='<i'+(i===paso?' class="on"':'')+'></i>';
    elPuntos.innerHTML=h;
    bAtras.disabled=paso===0;
    bSig.textContent=p.final?'Empezar':'Siguiente';
    colocar();
  }

  function abrir(desde){
    if(abierto)return;
    abierto=true;paso=desde||0;
    var fa=frameActivo();PASOS=(fa&&fa.id==='app-frame-3')?PASOS_AA:PASOS_PC;
    raiz.classList.add('open');raiz.setAttribute('aria-hidden','false');
    pintar();
    clearInterval(reloj);reloj=setInterval(function(){
      if(tieneHistorial()&&!raiz.dataset.manual){cerrar();return;}
      raiz.style.visibility=syncAbierto()?'hidden':'';
      colocar();
    },700);
  }
  function cerrar(){
    if(!abierto)return;
    abierto=false;marcarVisto();delete raiz.dataset.manual;
    mascotaTuto(false);
    clearInterval(reloj);
    raiz.classList.remove('open','con-foco');raiz.setAttribute('aria-hidden','true');raiz.style.visibility='';
  }
  window.PCTutorial={abrir:function(){raiz.dataset.manual='1';abrir(0);},cerrar:cerrar,abierto:function(){return abierto;}};

  bSig.onclick=function(){if(PASOS[paso].final){cerrar();return;}paso=Math.min(PASOS.length-1,paso+1);pintar();};
  bAtras.onclick=function(){paso=Math.max(0,paso-1);pintar();};
  bCerrar.onclick=cerrar;
  window.addEventListener('resize',function(){setTimeout(colocar,60);});

  var bVer=document.getElementById('drawer-tuto');
  if(bVer)bVer.onclick=function(){
    var bd=document.getElementById('drawer-backdrop'),mb=document.getElementById('menu-button');
    if(bd)bd.classList.remove('open');
    if(mb){mb.classList.remove('open');mb.setAttribute('aria-expanded','false');}
    setTimeout(function(){window.PCTutorial.abrir();},250);
  };

  /* El botón atrás de Android cierra primero el tutorial */
  var atrasOriginal=window.PC_ANDROID_BACK;
  window.PC_ANDROID_BACK=function(){
    if(abierto){cerrar();return true;}
    return typeof atrasOriginal==='function'?atrasOriginal():true;
  };

  /* Decide si mostrarlo: espera a que se cierre la ventana del código
     y a que cargue el tablero; si ya hay historial, no lo muestra. */
  if(visto())return;
  vigia=setInterval(function(){
    if(visto()){clearInterval(vigia);return;}
    if(tieneHistorial()){marcarVisto();clearInterval(vigia);return;}
    if(syncAbierto()||menuAbierto()||!appLista()){estable=0;return;}
    estable++;
    if(estable>=3){clearInterval(vigia);abrir(0);}
  },500);
})();
</script>
<script id="pc-enlace-ejercicio">
/* Enlace directo a un ejercicio: ?metodo=1|2&ejercicio=N
   Abre el método indicado y lleva al ejercicio. Luego limpia la dirección
   para que al recargar no vuelva a saltar. */
(function(){
  var q, n, m;
  try{ q=new URLSearchParams(location.search); }catch(e){ return; }
  n=parseInt(q.get('ejercicio'),10);
  m=q.get('metodo');
  /* Aprende Ajedrez: ?metodo=3&leccion=N2-005&item=4 (el ítem es el número del paso) */
  var lec=String(q.get('leccion')||'').toUpperCase();
  if(m==='3' && /^N[1-6]-\d{3}$/.test(lec)){
    var it3=parseInt(q.get('item'),10)||0;
    try{ q.delete('leccion'); q.delete('metodo'); q.delete('item'); var r3=q.toString(); history.replaceState(history.state,'',location.pathname+(r3?'?'+r3:'')+location.hash); }catch(e){}
    var t3=Date.now();
    (function abrir3(){
      var b3=document.querySelector('.app-choice[data-app="3"]');
      if(b3 && !b3.classList.contains('active')) b3.click();
      var f3=document.getElementById('app-frame-3'),w3=null;
      try{ w3=f3&&f3.contentWindow; }catch(e){}
      if(w3 && w3.document && w3.document.readyState==='complete' && typeof w3.aaAbrirLeccion==='function'){ try{ w3.aaAbrirLeccion(lec,it3); }catch(e){} return; }
      if(Date.now()-t3<20000) setTimeout(abrir3,150);
    })();
    return;
  }
  if(!(n>0) || (m!=='1' && m!=='2')) return;
  try{
    q.delete('ejercicio'); q.delete('metodo');
    var resto=q.toString();
    history.replaceState(history.state,'',location.pathname+(resto?'?'+resto:'')+location.hash);
  }catch(e){}
  var inicio=Date.now();
  (function intentar(){
    var b=document.querySelector('.app-choice[data-app="'+m+'"]');
    if(b && !b.classList.contains('active')) b.click();
    var f=document.getElementById('app-frame-'+m), w=null, d=null;
    try{ w=f&&f.contentWindow; d=w&&w.document; }catch(e){}
    if(d && d.readyState==='complete' && typeof w.jumpToNumber==='function' && d.getElementById('board')){
      try{ var tab=d.querySelector('.tab[data-v="train"]'); if(tab && !tab.classList.contains('active')) tab.click(); }catch(e){}
      try{ w.jumpToNumber(n); }catch(e){}
      setTimeout(function(){ try{ d.getElementById('board').scrollIntoView({block:'center'}); }catch(e){} },200);
      return;
    }
    if(Date.now()-inicio<20000) setTimeout(intentar,150);
  })();
})();
</script>
