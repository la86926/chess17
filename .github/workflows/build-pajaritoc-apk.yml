name: Build Chess de L APK

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'index1.html'
      - 'index2.html'
      - 'index3.html'
      - '*.png'
      - '*.mp3'
      - '*.js'
      - '*.css'
      - '*.wasm'
      - 'mascotas/**'
      - 'android-app/**'
      - '.github/workflows/build-pajaritoc-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Disable one-click unique moves
        run: |
          python - <<'PY'
          from pathlib import Path
          changed = []
          old = 'var PC_JUGADA_UNICA = true;'
          new = 'var PC_JUGADA_UNICA = false;'
          for name in ('index1.html', 'index2.html', 'index3.html'):
              p = Path(name)
              text = p.read_text(encoding='utf-8')
              if old in text:
                  p.write_text(text.replace(old, new), encoding='utf-8')
                  changed.append(name)
          print('Changed:', ', '.join(changed) if changed else 'none')
          PY

      - name: Commit interaction change
        run: |
          if git diff --quiet -- index1.html index2.html index3.html; then
            echo "No source change needed"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index1.html index2.html index3.html
            git commit -m "Use two-click interaction for unique moves"
            git push
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK (preinstalled on runner)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Prepare offline web assets
        run: |
          mkdir -p android-app/app/src/main/assets
          mkdir -p android-app/app/src/main/res/drawable
          cp index.html index1.html index2.html index3.html android-app/app/src/main/assets/
          cp -f *.png android-app/app/src/main/assets/ || true
          cp -f *.mp3 android-app/app/src/main/assets/ || true
          cp -f *.js android-app/app/src/main/assets/ || true
          cp -f *.css android-app/app/src/main/assets/ || true
          cp -f *.wasm android-app/app/src/main/assets/ || true
          cp -R mascotas android-app/app/src/main/assets/
          cp torre.png android-app/app/src/main/res/drawable/torre.png

      - name: Verify cloud sync assets
        run: |
          test -f android-app/app/src/main/assets/pc-cloud-sync.js
          test -f android-app/app/src/main/assets/mascotas/corgi-3.webp
          test -f android-app/app/src/main/assets/pc-cloud-sync.css
          test -f android-app/app/src/main/assets/pc-frame-cloud-bridge.js
          grep -Fq 'android.permission.INTERNET' android-app/app/src/main/AndroidManifest.xml

      - name: Build APK
        working-directory: android-app
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
            echo "Firmando con la clave fija"
          else
            echo "::warning::Sin clave fija guardada; se firma con clave de prueba"
          fi
          gradle :app:assembleRelease --no-daemon

      - name: Verify APK
        run: |
          APK=android-app/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$APK" | grep -F "package: name='com.luis.chessdel'"
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose "$APK"
          cp "$APK" ChessDeL.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ChessDeL
          path: ChessDeL.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest ChessDeL.apk \
            --title "Chess de L — APK" \
            --notes "APK listo para instalar en Android. Se actualiza solo con cada cambio." \
            --latest
